name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [sh, mksh, busybox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install shells
        run: sudo apt-get update -q && sudo apt-get install -y -q mksh busybox-static
      - name: Swap engine tests (${{ matrix.shell }})
        run: ./gradlew :engine:test -Ppatootie.shell=${{ matrix.shell }}

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patootie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
