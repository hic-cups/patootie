name: Build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [sh, mksh, busybox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install shells
        run: sudo apt-get update -q && sudo apt-get install -y -q mksh busybox-static
      - name: Swap engine tests (${{ matrix.shell }})
        run: ./gradlew :engine:test -Ppatootie.shell=${{ matrix.shell }}

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patootie-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PATOOTIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PATOOTIE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PATOOTIE_KEYSTORE_BASE64 secret not set; release APK is signed with a throwaway debug key and won't update over other builds."
          fi
      - name: Build release APK
        env:
          PATOOTIE_KEYSTORE_PASSWORD: ${{ secrets.PATOOTIE_KEYSTORE_PASSWORD }}
          PATOOTIE_KEY_ALIAS: ${{ secrets.PATOOTIE_KEY_ALIAS }}
          PATOOTIE_KEY_PASSWORD: ${{ secrets.PATOOTIE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: patootie-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
